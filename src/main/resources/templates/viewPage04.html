<html xmlns:th="http://www.thymeleaf.org">
<head>
	<title>Chap14-JPA-First-Exam</title>
</head>
<body>
<div align="center">
	<h3>JPA 데이터베이스 실습1</h3>
	<a th:href="@{/exam14_03/new}">Member 데이터 삽입</a> <br>
	<br> Product
	<table border="1" cellpadding="10">
		<tr>
			<th>아이디</th>
			<th>이름</th>
			<th>가격</th>
		</tr>
		<tr th:each="product : ${product2List}">
			<td th:text="${product.id}"></td>
			<td th:text="${product.name}"></td>
			<td th:text="${product.price}"></td>
				<a th:href="@{'/exam14_03/delete/' + ${product.id}}" onclick="return confirm('정말 삭제하시겠습니까?');">Delete</a>
		</tr>
	</table>

	<br> Detail
	<table border="1" cellpadding="10">
		<tr>
			<th>아이디</th>
			<th>설명</th>
			<th>무게</th>
			<th>높이</th>
			<th>너비</th>
		</tr>
		<tr th:each="detail : ${detailList}">
			<td th:text="${detail.id}"></td>
			<td th:text="${detail.description}"></td>
			<td th:text="${detail.weight}"></td>
			<td th:text="${detail.height}"></td>
			<td th:text="${detail.width}"></td>
			<a th:href="@{'/exam14_03/delete/' + ${detail.id}}" onclick="return confirm('정말 삭제하시겠습니까?');">Delete</a>
		</tr>
	</table>
</div>
</body>
</html>
</html>
